<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Fit</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --ink: #1a1a19; --muted: #76766f; --line: #e3e3de;
    --track: #e9e9e5; --accent: #3a6ea5; --tick: #5a5a55; --chip: #eeeeea; --chip-ink: #1a1a19;
    --stage: #f2f2ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a; --ink: #ececec; --muted: #91918b; --line: #2a2a31;
      --track: #2a2a31; --accent: #7aa7d9; --tick: #a8a8a2; --chip: #26262c; --chip-ink: #ececec;
      --stage: #1b1b21;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { padding: 0 16px env(safe-area-inset-bottom); max-width: 560px; margin: 0 auto; }
  header { padding: 18px 0 10px; }
  h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 10px; }
  #chips button { border: 0; border-radius: 9px; padding: 7px 11px; font: inherit; font-size: 13px;
    background: var(--chip); color: var(--chip-ink); cursor: pointer; }
  #chips button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  #stage { position: relative; height: min(62vh, 460px); background: var(--stage); border-radius: 14px; overflow: hidden;
    touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 11.5px;
    pointer-events: none; }
  #legend { color: var(--muted); font-size: 12px; text-align: center; margin: 10px 0 2px; overflow-wrap: anywhere; }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px;
    vertical-align: baseline; }
  #legend i.p { background: var(--accent); }
  #legend i.g { background: var(--ref); }
  :root { --ref: #a8622a; }
  @media (prefers-color-scheme: dark) { :root { --ref: #e3a06a; } }
  .bar { margin: 16px 0; }
  .bar .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .bar .top > div:first-child { flex: 0 0 auto; }
  .bar .name { color: var(--muted); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
  .bar .val { font-size: 15px; font-weight: 500; }
  .bar .delta { color: var(--muted); font-size: 12.5px; text-align: right; flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
  .bar .track { position: relative; height: 7px; border-radius: 4px; background: var(--track); margin-top: 8px; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
  .bar .tick { position: absolute; top: -4px; width: 2px; height: 15px; border-radius: 1px; background: var(--tick); }
  .reads p { margin: 6px 0; }
  .notes { color: var(--muted); font-size: 12.5px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .notes p { margin: 5px 0; }
  .est { color: var(--muted); font-size: 12.5px; }
  footer { color: var(--muted); font-size: 12px; margin: 20px 0 28px; }
  footer a { color: var(--muted); }
  #err { padding: 40px 0; color: var(--muted); }
</style>
</head>
<body>
<div id="app"><p id="err">Loading…</p></div>
<script type="module" src="/6ef1cfa0de5b6c/fit.js"></script>
</body>
</html>
